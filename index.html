<!DOCTYPE html>
<html>
<head>
<title>Custom Card Catalog</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#000000;
}

header{
    background:#111111;
    color:#FFFFFF;
    padding:20px;
    border-bottom:1px solid #2D2D2D;
}

nav{
    margin-top:10px;
    color:#FFFFFF;
}

.hero{
    background:#000000;
    color:#FFFFFF;
    margin:20px;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-radius:15px;
}

.hero-image{
    width:250px;
    height:300px;
    background:#ddd;
    border-radius:15px;
}

.catalog{
    display:flex;
    margin:20px;
    gap:20px;
}

.sidebar{
    width:250px;
    background:white;
    padding:20px;
    border-radius:15px;
}

    .filter-btn{
    display:inline-block;
    margin:4px;
    padding:8px 12px;

    border:1px solid #ddd;
    border-radius:999px;

    background:white;

    cursor:pointer;

    transition:0.2s;
}

    .filter-btn:hover{
    background:#f5f5f5;
}

    .filter-btn.active{
    background:#1F2937;
    color:white;
    border-color:#1F2937;
}

.content{
    flex:1;
    background:white;
    padding:20px;
    border-radius:15px;
}

.search{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ddd;
    border-radius:10px;
    box-sizing:border-box;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    cursor:pointer;
    transition:0.2s;
    padding:12px;
    box-sizing:border-box;
}

.card-image{
    aspect-ratio:4/5;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:10px;

    user-select:none;
    -webkit-user-drag:none;
}

.card-name{
    margin-top:10px;
    text-align:center;
    font-weight:bold;
}

.card:hover{
    transform:translateY(-4px);
}

footer{
    background:white;
    padding:20px;
    text-align:center;
    margin:20px;
    border-radius:15px;
}

.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.popup-content{
    width:800px;
    background:black;
    color:white;
    border-radius:20px;
    padding:40px;
    position:relative;
    display:flex;
    gap:40px;
}

.popup-actions{
    position:absolute;
    top:20px;
    right:20px;
    display:flex;
    gap:10px;
}

.popup-actions img{
    width:32px;
    height:32px;
    cursor:pointer;
}

.popup-left img{
    width:450px;
    height:auto;
    display:block;
}
    
.shopee-btn{
    width:80px;
    height:auto;
    cursor:pointer;
}
    
</style>
</head>

<body>

<header>
    <h1>Custom Card Catalog</h1>

    <nav>
        Product | Contact
    </nav>
</header>

<section class="hero">

    <div>
        <h2>Custom Card Collection</h2>

        <p>
        Fan-made custom card project.
        Browse all available cards here.
        </p>
    </div>

    <div class="hero-image"></div>

</section>

<section class="catalog">

<div class="sidebar">

    <h3>Filters</h3>

    <p><b>Card Type</b></p>

    <button class="filter-btn" data-type="Animal">Animal</button>
    <button class="filter-btn" data-type="Strong">Strong</button>
    <button class="filter-btn" data-type="Miracle">Miracle</button>
    <button class="filter-btn" data-type="Promotion">Promotion</button>

    <br><br>

    <p><b>Rarity</b></p>

    <button class="filter-btn" data-rarity="Common">Common</button>
    <button class="filter-btn" data-rarity="Rare">Rare</button>
    <button class="filter-btn" data-rarity="Gold">Gold</button>

    <br><br>

    <p><b>Language</b></p>

    <button class="filter-btn" data-language="Eng">Eng</button>
    <button class="filter-btn" data-language="Jpn">Jpn</button>

    <br><br>

    <p><b>Compatibility</b></p>

    <button class="filter-btn" data-compatibility="AK">AK</button>
    <button class="filter-btn" data-compatibility="AK+">AK+</button>

</div>

    <div class="content">

<input
class="search"
id="searchInput"
placeholder="Search cards...">

<div class="cards" id="cards-container">

</div>

    </div>

</section>

<footer>
    This is a fanmade custom card project.
</footer>

<div id="popup" class="popup">

    <div class="popup-content">

        <div class="popup-actions">

            <img src="assets/icons/thumb-off.png">

            <img src="assets/icons/share.png">

            <img
            src="assets/icons/close.png"
            onclick="closePopup()">

        </div>

        <div class="popup-left">

<img
id="popup-image"
src="">

        </div>

        <div class="popup-right">

            <h2 id="popup-name"></h2>

            <p><b>Type:</b> <span id="popup-type"></span></p>

            <p><b>Rarity:</b> <span id="popup-rarity"></span></p>

            <p><b>Language:</b> <span id="popup-language"></span></p>

            <p><b>Compatibility:</b> <span id="popup-compatibility"></span></p>

            <p><b>Stock:</b> <span id="popup-stock"></span></p>

            <br>

            <p>Buy now at:</p>

<a id="popup-shopee" target="_blank">

    <img
    src="assets/icons/shopee.png"
    class="shopee-btn">

</a>

        </div>

    </div>

</div>

<script>

function openPopup(index){

    var card = window.cardsData[index];

    document.getElementById("popup-image").src =
    "assets/cards/" + card.image;

    document.getElementById("popup-name").innerText =
    card.name;

    document.getElementById("popup-type").innerText =
    card.type;

    document.getElementById("popup-rarity").innerText =
    card.rarity;

    document.getElementById("popup-language").innerText =
    card.language;

    document.getElementById("popup-compatibility").innerText =
    card.compatibility;

    document.getElementById("popup-stock").innerText =
    card.stock;

    document.getElementById("popup-shopee").href =
    card.shopee;

    document.getElementById("popup").style.display =
    "flex";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

function renderCards(cards){

    var container =
    document.getElementById("cards-container");

    container.innerHTML = "";

    cards.forEach(function(card){

        container.innerHTML +=
        '<div class="card" onclick="openPopup(' + window.cardsData.indexOf(card) + ')">' +
            '<div class="card-image">' +
                '<img src="assets/cards/' + card.image + '">' +
            '</div>' +
            '<div class="card-name">' +
                card.name +
            '</div>' +
        '</div>';

    });

}

fetch("assets/data/cards.json")
.then(function(response){
    return response.json();
})
.then(function(cards){

    window.cardsData = cards;
    window.filteredCards = cards;

    renderCards(cards);

    document.getElementById("searchInput")
    .addEventListener("input", function(){

        var keyword =
        this.value.toLowerCase();

        var results = window.cardsData.filter(function(card){

            return card.name
            .toLowerCase()
            .includes(keyword);

        });

        renderCards(results);

    });

});

<script>

document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

window.addEventListener("load", function(){

    document.querySelectorAll(".filter-btn")
    .forEach(function(button){

        button.addEventListener("click", function(){

            this.classList.toggle("active");

        });

    });

});

</script> 
    
</body>
</html>
