<!DOCTYPE html>
<html>
<head>
<title>Custom Card Catalog</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f5f5f5;
}

header{
    background:white;
    padding:20px;
    border-bottom:1px solid #ddd;
}

nav{
    margin-top:10px;
}

.hero{
    background:white;
    margin:20px;
    padding:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-radius:15px;
}

.hero-image{
    width:250px;
    height:300px;
    background:#ddd;
    border-radius:15px;
}

.catalog{
    display:flex;
    margin:20px;
    gap:20px;
}

.sidebar{
    width:250px;
    background:white;
    padding:20px;
    border-radius:15px;
}

.content{
    flex:1;
    background:white;
    padding:20px;
    border-radius:15px;
}

.search{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ddd;
    border-radius:10px;
    box-sizing:border-box;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:20px;
}

.card{
    aspect-ratio:3/4;
    background:#ddd;
    border-radius:15px;
    cursor:pointer;
    transition:0.2s;
}

.card img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:10px;
}
    
.card:hover{
    transform:translateY(-4px);
}

footer{
    background:white;
    padding:20px;
    text-align:center;
    margin:20px;
    border-radius:15px;
}
</style>
</head>

<body>

<header>
    <h1>Custom Card Catalog</h1>

    <nav>
        Product | Contact
    </nav>
</header>

<section class="hero">

    <div>
        <h2>Custom Card Collection</h2>

        <p>
        Fan-made custom card project.
        Browse all available cards here.
        </p>
    </div>

    <div class="hero-image"></div>

</section>

<section class="catalog">

    <div class="sidebar">

        <h3>Filters</h3>

        <p><b>Card Type</b></p>

        <p>Animal</p>
        <p>Strong</p>
        <p>Miracle</p>
        <p>Promotion</p>

        <br>

        <p><b>Compatibility</b></p>

        <p>AK</p>
        <p>AK+</p>

    </div>

    <div class="content">

        <input
        class="search"
        placeholder="Search cards...">

        <div class="cards">

            <div class="card">
<img src="assets/cards/custom a.webp">
<h3>Custom A</h3>
</div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>

            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>

        </div>

    </div>

</section>

<footer>
    This is a fanmade custom card project.
</footer>

</body>
</html>
