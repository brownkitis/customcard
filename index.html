<!DOCTYPE html>
<html>
<head>
<title>Custom Card Catalog</title>

<style>

@font-face{
    font-family: "Coolvetica Book Italic";
    src: url("assets/font/CoolveticaBk-Italic.ttf");
}

@font-face{
    font-family: "Coolvetica Book Regular";
    src: url("assets/font/CoolveticaBk-Regular.ttf");
}

@font-face{
    font-family: "Coolvetica El Italic";
    src: url("assets/font/CoolveticaEl-Italic");
}

@font-face{
    font-family: "Coolvetica Lite Regular";
    src: url("assets/font/CoolveticaLt-Regular.ttf");
}

@font-face{
    font-family: "Coolvetica Bold Italic";
    src: url("assets/font/CoolveticaRg-BoldItalic.ttf");
}

@font-face{
    font-family: "Coolvetica Bold";
    src: url("assets/font/CoolveticaRg-Bold.ttf");
}
    
body{
    font-family:"Coolvetica Lite Regular";
    letter-spacing:1px;
    margin:0;
    background:#ebebeb;
}

header{
  font-family:"Coolvetica Lite Regular";
font-size:6px;
color:#000000;
    background:#ffffff;
padding:5px;
margin:5px;
border:0px solid #DDDDDD;
border-radius:0px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

    .logo{
    height:65px;
    width:auto;
}

    .header-title{
    font-size:18px;
    font-weight:600;
}

nav{
    margin-top:10px;
    color:#FFFFFF;
}
    
.hero{
    text-align:center;
}

.hero-banner{
    width:50%;
    height:auto;

    padding:10px 0;
    margin:20px auto;

    display:block;
}

.catalog{
    display:flex;

    margin:20px;

    background:white;

    border-radius:15px;

    padding:25px;

    gap:25px;
}

.sidebar h3{
    font-size:26px;
    font-weight:700;
    margin-bottom:20px;
}

.sidebar p b{
    font-style:italic;
    font-size:14px;
    font-weight:600;
    color:#666666;
}

.filter-btn{
    font-family:inherit;
    font-style:normal;
    font-size:14px;
}
    
.sidebar{
    width:250px;

    padding-right:25px;

    border-right:1px solid #dddddd;
}

    .filter-btn{
    display:inline-block;
    margin:4px;
    padding:8px 8px;

        min-width:80px;
        text-align:center;

    border:2px solid #000000;
    border-radius:999px;

    background:#ffffff;
    cursor:pointer;


}

    .filter-btn.active{
    background:#000000;
    color:#ffffff;
    border-color:#000000;
}

.content{
    flex:1;

    padding-left:25px;
}

.search{
    width:450px;

    padding:25px 30px;

    border:none;

    border-radius:999px;

    background:#000000;

    color:white;

    font-size:12px;

    outline:none;
}

    .search-wrapper{
    width:100%;
    text-align:center;

    margin-top:-40px;
    margin-bottom:20px;

    position:relative;
    z-index:10;
}

    .search::placeholder{
    color:white;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:5px;
}

.card{
    background:#ffffff;
    color:#000000;

    border-radius:0px;
    cursor:pointer;
    transition:0s;

    padding:12px;
    box-sizing:border-box;
}

    .card:hover{
    background:#000000;
    color:#FFFFFF;
}
    
.card-image{
    aspect-ratio:4/5;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:0px;

    user-select:none;
    -webkit-user-drag:none;
}

    .card-name{
    margin-top:10px;
    text-align:left;
    font-family:"Coolvetica Book Regular";
    font-size:11px;
        
    color:#000000;
    transition:0s;
}

.card:hover .card-name{
    color:#FFFFFF;
}
    

footer{
    background:white;
    padding:20px;
    text-align:center;
    margin:20px;
    border-radius:15px;
}

.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.popup-content{
    width:800px;
    background:black;
    color:white;
    border-radius:20px;
    padding:40px;
    position:relative;
    display:flex;
    gap:40px;
}

.popup-actions{
    position:absolute;
    top:20px;
    right:20px;
    display:flex;
    gap:10px;
}

.popup-actions img{
    width:32px;
    height:32px;
    cursor:pointer;
}

.popup-left img{
    width:450px;
    height:auto;
    display:block;
}
    
.shopee-btn{
    width:80px;
    height:auto;
    cursor:pointer;
}

#result-count{
    margin-top:10px;

    text-align:center;

    font-size:12px;

    color:#888;
}
    
</style>
</head>

<body>

<header>

    <img
    src="assets/icons/brownkitis_1.webp"
    class="logo">

    <div class="header-title">
        Custom & Fanmade Card
    </div>

</header>

<section class="hero">

    <img
    src="assets/icons/banner.webp"
    class="hero-banner">

</section>

<div class="search-wrapper">

<input
class="search"
id="searchInput"
placeholder="Search cards...">

<div id="result-count"></div>

</div>

<section class="catalog">

<div class="sidebar">

<h3>Filters</h3>

<p><b>Card Type</b></p>

<button class="filter-btn" data-type="Animal">Animal</button>
<button class="filter-btn" data-type="Strong">Strong</button>
<button class="filter-btn" data-type="Miracle">Miracle</button>
<button class="filter-btn" data-type="Promotion">Promotion</button>

<br><br>

<p><b>Rarity</b></p>

<button class="filter-btn" data-rarity="Common">Common</button>
<button class="filter-btn" data-rarity="Gold">Gold</button>
<button class="filter-btn" data-rarity="Ultra">Ultra</button>

<br><br>

<p><b>Language</b></p>

<button class="filter-btn" data-language="Eng">Eng</button>
<button class="filter-btn" data-language="Jp">Jp</button>

<br><br>

<p><b>Compatibility</b></p>

<button class="filter-btn" data-compatibility="AK">AK</button>
<button class="filter-btn" data-compatibility="AK+">AK+</button>

</div>

<div class="content">
    
<div class="cards" id="cards-container">

</div>

</div>

</section>


<footer>
    This is a fanmade custom card project.
</footer>

<div id="popup" class="popup">

    <div class="popup-content">

<div class="popup-actions">

    <img
    src="assets/icons/close.png"
    onclick="closePopup()">

</div>

        <div class="popup-left">

<img
id="popup-image"
src="">

        </div>

        <div class="popup-right">

            <h2 id="popup-name"></h2>

            <p><b>Type:</b> <span id="popup-type"></span></p>

            <p><b>Rarity:</b> <span id="popup-rarity"></span></p>

            <p><b>Language:</b> <span id="popup-language"></span></p>

            <p><b>Compatibility:</b> <span id="popup-compatibility"></span></p>

            <p><b>Stock:</b> <span id="popup-stock"></span></p>

            <br>

            <p>Buy now at:</p>

<a id="popup-shopee" target="_blank">

    <img
    src="assets/icons/shopee.png"
    class="shopee-btn">

</a>

        </div>

    </div>

</div>

<script>
    
function openPopup(index){

    var card = window.cardsData[index];

    document.getElementById("popup-image").src =
    "assets/cards/" + card.image;

    document.getElementById("popup-name").innerText =
    card.name;

    document.getElementById("popup-type").innerText =
    card.type;

    document.getElementById("popup-rarity").innerText =
    card.rarity;

    document.getElementById("popup-language").innerText =
    card.language;

    document.getElementById("popup-compatibility").innerText =
    card.compatibility;

    document.getElementById("popup-stock").innerText =
    card.stock;

    document.getElementById("popup-shopee").href =
    card.shopee;
    
    document.getElementById("popup").style.display =
    "flex";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

function renderCards(cards){

    var container =
    document.getElementById("cards-container");

    container.innerHTML = "";

    document.getElementById("result-count").innerText =
cards.length + " results";

    cards.forEach(function(card){

        container.innerHTML +=
        '<div class="card" onclick="openPopup(' + window.cardsData.indexOf(card) + ')">' +
            '<div class="card-image">' +
                '<img src="assets/cards/' + card.image + '">' +
            '</div>' +
            '<div class="card-name">' +
                card.name +
            '</div>' +
        '</div>';

    });

}

function applyFilters(){

    var keyword =
    document.getElementById("searchInput")
    .value
    .toLowerCase();

    var activeTypes = [];
    var activeRarities = [];
    var activeLanguages = [];
    var activeCompatibilities = [];

    document.querySelectorAll(".filter-btn.active")
    .forEach(function(button){

        if(button.dataset.type){
            activeTypes.push(button.dataset.type);
        }

        if(button.dataset.rarity){
            activeRarities.push(button.dataset.rarity);
        }

        if(button.dataset.language){
            activeLanguages.push(button.dataset.language);
        }

        if(button.dataset.compatibility){
            activeCompatibilities.push(button.dataset.compatibility);
        }

    });

    var results = window.cardsData.filter(function(card){

        var matchSearch =
        card.name.toLowerCase().includes(keyword);

        var matchType =
        activeTypes.length === 0 ||
        activeTypes.some(type =>
            card.type.includes(type)
        );

        var matchRarity =
        activeRarities.length === 0 ||
        activeRarities.includes(card.rarity);

        var matchLanguage =
        activeLanguages.length === 0 ||
        activeLanguages.includes(card.language);

        var matchCompatibility =
        activeCompatibilities.length === 0 ||
        activeCompatibilities.some(comp =>
            card.compatibility.includes(comp)
        );

        return (
            matchSearch &&
            matchType &&
            matchRarity &&
            matchLanguage &&
            matchCompatibility
        );

    });

    renderCards(results);
}
    
fetch("assets/data/cards.json")
.then(function(response){
    return response.json();
})
.then(function(cards){

    window.cardsData = cards;
    window.filteredCards = cards;

    renderCards(cards);

document.getElementById("searchInput")
.addEventListener("input", applyFilters);

});

</script>
    
<script>

document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

window.addEventListener("load", function(){

    document.querySelectorAll(".filter-btn")
    .forEach(function(button){

button.addEventListener("click", function(){

    this.classList.toggle("active");

    applyFilters();

});

    });

});

</script> 
    
</body>
</html>
